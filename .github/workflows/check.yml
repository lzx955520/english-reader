name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run licenses
      - run: xvfb-run -a npm run test:ui
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: english-reader-windows-x64
          path: release/*.exe
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture dependency audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          cat npm-audit.json
          node -e "const r = require('./npm-audit.json'); if (r.error || !r.metadata?.vulnerabilities || !r.vulnerabilities) process.exit(1)"
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7
